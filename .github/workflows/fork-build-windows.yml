# Fork 专用 Windows 构建：不依赖签名密钥和上游 release 流程，
# 构建 NSIS 安装包并上传为 Actions artifact 供下载。
name: Fork Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 (NSIS)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
          key: fork-build-windows-x64
          cache-on-failure: false
        env:
          RUST_CACHE_COMPRESS: true

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # fork 没有 TAURI_SIGNING_PRIVATE_KEY，禁用 updater 签名产物，
      # 其余（NSIS 安装包、ConPTY、MCP sidecar）与上游流程一致。
      # 各阶段拆开便于定位失败步骤。
      - name: Prepare ConPTY
        run: pnpm prepare:conpty

      - name: Build frontend (sidecar + tsc + vite)
        run: pnpm build

      # beforeBuildCommand 会再跑一次 prepare:conpty + pnpm build，
      # 前者有缓存、后者多花 1-2 分钟，可接受。
      - name: Build Tauri app (NSIS)
        run: pnpm tauri build --bundles nsis --config '{"bundle":{"createUpdaterArtifacts":false}}'

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: nyaterm-windows-x64-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
