# Fork 专用 Windows 构建：不依赖签名密钥和上游 release 流程，
# 构建 NSIS 安装包并上传为 Actions artifact 供下载。
name: Fork Windows Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows x64 (NSIS)
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: |
            ./src-tauri -> target
          key: fork-build-windows-x64
          cache-on-failure: false
        env:
          RUST_CACHE_COMPRESS: true

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 9
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # fork 没有 TAURI_SIGNING_PRIVATE_KEY，禁用 updater 签名产物，
      # 其余（NSIS 安装包、ConPTY、MCP sidecar）与上游流程一致。
      # 各阶段拆开便于定位失败步骤。
      - name: Prepare ConPTY
        run: pnpm prepare:conpty

      - name: Build frontend (sidecar + tsc + vite)
        run: pnpm build

      # beforeBuildCommand 会再跑一次 prepare:conpty + pnpm build，
      # 前者有缓存、后者多花 1-2 分钟，可接受。
      # --config 用仓库内的 JSON 文件传参，避免多层 shell 引号转义问题。
      - name: Build Tauri app (NSIS)
        run: pnpm tauri build --bundles nsis --config fork-tauri-override.json

      - name: Upload NSIS installer
        uses: actions/upload-artifact@v4
        with:
          name: nyaterm-windows-x64-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error

      # 绿色版：与官方 portable 包结构一致——
      # nyaterm.exe + nyaterm-mcp.exe + portable.flag + data/ + conpty 资源
      - name: Package portable zip
        shell: pwsh
        run: |
          $releaseDir = "src-tauri/target/release"
          $stage = "portable-stage"
          $zipPath = "NyaTerm-portable-x64.zip"
          New-Item -ItemType Directory -Path $stage -Force | Out-Null

          Copy-Item "$releaseDir/nyaterm.exe" $stage
          # MCP sidecar：bundle 后位于 release 目录，回退到构建脚本输出位置
          $mcp = "$releaseDir/nyaterm-mcp.exe"
          if (!(Test-Path $mcp)) { $mcp = "src-tauri/binaries/nyaterm-mcp/nyaterm-mcp.exe" }
          if (Test-Path $mcp) { Copy-Item $mcp $stage } else { Write-Warning "nyaterm-mcp.exe not found" }

          # 便携模式标记：数据保存到同目录 data/ 而不是用户主目录
          New-Item -ItemType File -Path "$stage/portable.flag" -Force | Out-Null
          New-Item -ItemType Directory -Path "$stage/data" -Force | Out-Null

          if (Test-Path "$releaseDir/conpty") { Copy-Item "$releaseDir/conpty" "$stage/conpty" -Recurse }
          if (Test-Path "$releaseDir/conpty-license") { Copy-Item "$releaseDir/conpty-license" "$stage/conpty-license" -Recurse }

          Compress-Archive -Path "$stage/*" -DestinationPath $zipPath
          Write-Output "Portable zip created: $zipPath"

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: nyaterm-windows-x64-portable
          path: NyaTerm-portable-x64.zip
          if-no-files-found: error
